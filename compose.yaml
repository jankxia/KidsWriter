services:
  kidswriter:
    # 用发布好的镜像；想从源码构建就注释掉 image，改用 build: .
    image: ghcr.io/jankxia/kidswriter:v1.1
    # build: .
    container_name: kidswriter
    restart: unless-stopped
    network_mode: host
    volumes:
      - /vol1/1000/kidswriter/data:/app/data
    environment:
      TZ: Asia/Shanghai
      KIDSWRITER_PORT: "8122"
